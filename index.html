<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>For Nour ❤️</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ================================
           BODY
        ================================= */

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            /* BACKGROUND IMAGE ALWAYS VISIBLE */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)
                ),
                url("salah.jpeg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow: hidden;
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {
            width: 90%;
            max-width: 420px;

            padding: 35px 20px;

            text-align: center;

            background: rgba(255, 255, 255, 0.90);

            border-radius: 25px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.30);

            position: relative;

            z-index: 10;
        }


        /* ================================
           HEART
        ================================= */

        .heart {
            font-size: 55px;

            margin-bottom: 15px;

            animation:
                heartbeat 1.2s infinite;
        }


        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }

        }


        /* ================================
           QUESTION
        ================================= */

        h1 {
            font-size: 28px;

            color: #e91e63;

            margin-bottom: 25px;

            line-height: 1.4;
        }


        /* ================================
           BUTTON CONTAINER
        ================================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            min-height: 65px;

            position: relative;
        }


        /* ================================
           BUTTONS
        ================================= */

        button {
            border: none;

            padding: 15px 25px;

            font-size: 18px;

            font-weight: bold;

            border-radius: 50px;

            cursor: pointer;

            min-width: 110px;

            transition:
                transform 0.2s ease,
                left 0.15s ease,
                top 0.15s ease;
        }


        button:active {
            transform: scale(0.92);
        }


        /* ================================
           YES BUTTON
        ================================= */

        #yesBtn {
            background: #ff4081;

            color: white;

            box-shadow:
                0 5px 15px
                rgba(255, 64, 129, 0.4);
        }


        /* ================================
           NO BUTTON
        ================================= */

        #noBtn {
            background: #eeeeee;

            color: #555;
        }


        /* ================================
           MESSAGE
        ================================= */

        .message {
            margin-top: 20px;

            color: #555;

            font-size: 16px;

            min-height: 24px;

            line-height: 1.5;
        }


        /* ================================
           SUCCESS MESSAGE
        ================================= */

        .success {
            color: #e91e63;

            font-weight: bold;

            font-size: 20px;
        }


        /* ================================
           RUNNING NO BUTTON
        ================================= */

        .running {
            position: fixed !important;

            z-index: 9999;

            transition:
                left 0.15s ease,
                top 0.15s ease;
        }


        /* ================================
           FLOATING HEARTS
        ================================= */

        .floating-heart {
            position: fixed;

            bottom: -30px;

            font-size: 25px;

            animation:
                floatUp 4s linear forwards;

            pointer-events: none;

            z-index: 100;
        }


        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 400px) {

            .container {
                width: 92%;

                padding: 30px 15px;
            }


            h1 {
                font-size: 24px;
            }


            button {
                min-width: 100px;

                padding: 14px 20px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         MAIN CONTENT
    ================================= -->

    <div class="container">


        <!-- Heart -->

        <div class="heart">
            ❤️
        </div>


        <!-- Question -->

        <h1 id="question">
            Nour, will you kiss me? 😘💋
        </h1>


        <!-- Buttons -->

        <div class="buttons">

            <!-- NO FIRST -->

            <button id="noBtn">
                NO 😭
            </button>


            <!-- YES SECOND -->

            <button id="yesBtn">
                YES ❤️
            </button>

        </div>


        <!-- Message -->

        <div
            class="message"
            id="message">
        </div>


    </div>



    <script>

        /* =================================
           GET ELEMENTS
        ================================= */

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");

        const question =
            document.getElementById("question");

        const message =
            document.getElementById("message");


        /* =================================
           COUNT NO CLICKS
        ================================= */

        let noClicks = 0;



        /* =================================
           YES BUTTON
        ================================= */

        yesBtn.addEventListener(
            "click",
            function () {

                question.innerHTML =
                    "I knew you would say YES! 😍❤️💋";


                message.innerHTML =
                    "Nour ❤️ you just made me very happy 🥹💖";


                message.classList.add(
                    "success"
                );


                /* Create romantic hearts */

                createHearts();

            }
        );



        /* =================================
           NO BUTTON
        ================================= */

        noBtn.addEventListener(
            "click",
            function () {

                noClicks++;


                /* =================================
                   FIRST NO CLICK
                ================================= */

                if (noClicks === 1) {

                    question.innerHTML =
                        "Nour, click YES, I wanna kiss you 😘💋";


                    message.innerHTML =
                        "Come on Nour... don't click NO 😭❤️";


                    /*
                        Swap button positions.

                        BEFORE:

                        NO    YES

                        AFTER:

                        YES   NO
                    */

                    const buttons =
                        document.querySelector(
                            ".buttons"
                        );


                    buttons.insertBefore(
                        yesBtn,
                        noBtn
                    );

                }


                /* =================================
                   SECOND NO CLICK
                ================================= */

                else if (noClicks >= 2) {

                    question.innerHTML =
                        "Nour, you can't escape! 😂💋❤️";


                    message.innerHTML =
                        "The NO button is running away! 🏃‍♂️💨😭";


                    /*
                        Make NO button run
                    */

                    noBtn.classList.add(
                        "running"
                    );


                    /*
                        Move immediately
                    */

                    moveButton();

                }

            }
        );



        /* =================================
           MOVE NO BUTTON
        ================================= */

        function moveButton() {

            const buttonWidth =
                noBtn.offsetWidth;


            const buttonHeight =
                noBtn.offsetHeight;


            /*
                Keep button inside screen
            */

            const maxX =
                window.innerWidth -
                buttonWidth -
                10;


            const maxY =
                window.innerHeight -
                buttonHeight -
                10;


            const minX = 10;

            const minY = 10;


            /*
                Generate random position
            */

            const randomX =
                Math.floor(
                    Math.random() *
                    (maxX - minX)
                ) + minX;


            const randomY =
                Math.floor(
                    Math.random() *
                    (maxY - minY)
                ) + minY;


            /*
                Apply position
            */

            noBtn.style.left =
                randomX + "px";


            noBtn.style.top =
                randomY + "px";

        }



        /* =================================
           TOUCH SCREEN
        ================================= */

        noBtn.addEventListener(
            "touchstart",
            function (event) {

                /*
                    After second NO,
                    make button escape.
                */

                if (noClicks >= 2) {

                    event.preventDefault();

                    moveButton();

                }

            }
        );



        /* =================================
           MOUSE
        ================================= */

        noBtn.addEventListener(
            "mouseenter",
            function () {

                if (noClicks >= 2) {

                    moveButton();

                }

            }
        );



        /* =================================
           FLOATING HEARTS
        ================================= */

        function createHearts() {


            for (
                let i = 0;
                i < 20;
                i++
            ) {


                setTimeout(
                    function () {


                        const heart =
                            document.createElement(
                                "div"
                            );


                        heart.classList.add(
                            "floating-heart"
                        );


                        /*
                            Romantic emojis
                        */

                        const hearts = [

                            "❤️",
                            "💕",
                            "💖",
                            "💗",
                            "💘",
                            "💋",
                            "😍",
                            "🥰"

                        ];


                        heart.innerHTML =
                            hearts[
                                Math.floor(
                                    Math.random() *
                                    hearts.length
                                )
                            ];


                        /*
                            Random horizontal position
                        */

                        heart.style.left =
                            Math.random() *
                            100 +
                            "vw";


                        /*
                            Random animation speed
                        */

                        heart.style.animationDuration =
                            (
                                3 +
                                Math.random() * 3
                            ) + "s";


                        document.body.appendChild(
                            heart
                        );


                        /*
                            Remove after animation
                        */

                        setTimeout(
                            function () {

                                heart.remove();

                            },
                            6000
                        );


                    },
                    i * 150
                );

            }

        }

    </script>

</body>

</html>
