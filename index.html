<!DOCTYPE html>
<html>
<head>
    <title>Important Question 😏</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #ffe6f0;
            text-align: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 320px;
        }

        h1 {
            color: #ff4d88;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #yes {
            background: #4CAF50;
            color: white;
        }

        #no {
            background: #ff4d4d;
            color: white;
            position: absolute;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Do you like me? 👀❤️</h1>

    <button id="yes" onclick="yesClicked()">Yes ❤️</button>
    <button id="no" onclick="moveNo()">No 😭</button>

    <p id="message"></p>
</div>

<script>
    function moveNo() {
        const button = document.getElementById("no");

        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 60);

        button.style.left = x + "px";
        button.style.top = y + "px";
    }

    function yesClicked() {
        document.getElementById("message").innerHTML =
            "I KNEW IT 😎❤️";
    }
</script>

</body>
</html>
